<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rachod Medacha - Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'Noto Sans Thai', 'sans-serif'] },
          colors: { tech: { dark: '#0f172a', card: '#1e293b', accent: '#38bdf8' } }
        }
      }
    }
  </script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>

<body class="bg-tech-dark text-slate-300 antialiased min-h-screen py-10">

  <main class="max-w-6xl mx-auto px-4 md:px-8 grid grid-cols-1 lg:grid-cols-4 gap-8">

    <!-- ================= SIDEBAR ================= -->
    <aside class="bg-tech-card rounded-3xl p-8 shadow-2xl border border-slate-700/50 lg:col-span-1 h-fit sticky top-10 z-20">
      <div class="flex flex-col items-center text-center pb-6 border-b border-slate-700">
        <figure class="w-32 h-32 rounded-2xl overflow-hidden mb-4 border-4 border-slate-700 shadow-lg relative group">
          <img src="./assets/images/profile.jpg" alt="Rachod Medacha" class="w-full h-full object-cover transition duration-300 group-hover:scale-110" onerror="this.src='https://ui-avatars.com/api/?name=Rachod+Medacha&background=38bdf8&color=fff&size=200'">
        </figure>
        <h1 class="text-2xl font-semibold text-white mb-2">Rachod Medacha</h1>
        <span class="bg-slate-800 text-tech-accent px-4 py-1.5 rounded-lg text-sm font-medium tracking-wide shadow-inner">
          System Security Engineer
        </span>
      </div>

      <ul class="pt-6 space-y-5">
        <li class="flex items-center gap-4">
          <div class="w-10 h-10 min-w-[40px] rounded-lg bg-slate-800 text-tech-accent flex items-center justify-center shadow-md">
            <ion-icon name="mail-outline" class="text-xl"></ion-icon>
          </div>
          <div class="overflow-hidden">
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Email</p>
            <a href="mailto:intelgeneral.life@gmail.com" class="text-sm text-slate-200 hover:text-tech-accent transition-colors block leading-tight">
              intelgeneral.life<br>@gmail.com
            </a>
          </div>
        </li>
        <li class="flex items-center gap-4">
          <div class="w-10 h-10 min-w-[40px] rounded-lg bg-slate-800 text-tech-accent flex items-center justify-center shadow-md">
            <ion-icon name="phone-portrait-outline" class="text-xl"></ion-icon>
          </div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Phone</p>
            <a href="tel:+66612566898" class="text-sm text-slate-200 hover:text-tech-accent transition-colors">+66 612566898</a>
          </div>
        </li>
        <li class="flex items-center gap-4">
          <div class="w-10 h-10 min-w-[40px] rounded-lg bg-slate-800 text-tech-accent flex items-center justify-center shadow-md">
            <ion-icon name="calendar-outline" class="text-xl"></ion-icon>
          </div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Birthday</p>
            <time datetime="1986-12-30" class="text-sm text-slate-200">30 Dec 1986</time>
          </div>
        </li>
        <li class="flex items-center gap-4">
          <div class="w-10 h-10 min-w-[40px] rounded-lg bg-slate-800 text-tech-accent flex items-center justify-center shadow-md">
            <ion-icon name="location-outline" class="text-xl"></ion-icon>
          </div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Location</p>
            <address class="text-sm text-slate-200 not-italic">Bangkok, TH</address>
          </div>
        </li>
      </ul>

      <div class="mt-8">
        <a href="./assets/docs/Rachod_Medacha_Resume.pdf" download class="w-full flex items-center justify-center gap-3 bg-tech-accent text-slate-900 py-3 rounded-xl text-sm font-semibold hover:bg-sky-400 transition-all shadow-[0_0_15px_rgba(56,189,248,0.3)] hover:shadow-[0_0_25px_rgba(56,189,248,0.5)]">
          <ion-icon name="download-outline" class="text-2xl"></ion-icon>
          <span class="text-center leading-tight">Download<br>Resume</span>
        </a>
      </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="bg-tech-card rounded-3xl shadow-2xl border border-slate-700/50 lg:col-span-3 overflow-hidden relative">
      
      <!-- Navbar (Active: Contact) -->
      <nav class="bg-slate-800/80 border-b border-slate-700 px-8 py-5 backdrop-blur-md sticky top-0 z-10 flex justify-center lg:justify-start">
        <ul class="flex gap-8 text-sm font-medium">
          <li><a href="index.html" class="text-slate-400 hover:text-white pb-1 transition-colors">About</a></li>
          <li><a href="resume.html" class="text-slate-400 hover:text-white pb-1 transition-colors">Resume</a></li>
          <li><a href="portfolio.html" class="text-slate-400 hover:text-white pb-1 transition-colors">Portfolio</a></li>
          <li><a href="contact.html" class="text-tech-accent border-b-2 border-tech-accent pb-1 transition-colors">Contact</a></li>
        </ul>
      </nav>

      <div class="p-8 lg:p-10">
        <!-- CONTACT SECTION -->
        <section class="space-y-8">
          
          <div class="flex items-center gap-4 mb-6">
            <h2 class="text-3xl font-semibold text-white">Contact</h2>
            <div class="h-1 flex-1 bg-gradient-to-r from-tech-accent to-transparent rounded-full opacity-30"></div>
          </div>

          <!-- Mapbox -->
          <div class="rounded-2xl overflow-hidden border border-slate-700 shadow-lg h-80">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3875.696793581605!2d100.50176581524838!3d13.75633019036191!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e299219ec9e14b%3A0x400d1b2ca2aa350!2sBangkok%2C%20Thailand!5e0!3m2!1sen!2sth!4v1690012345678!5m2!1sen!2sth" 
              class="w-full h-full border-0" 
              allowfullscreen="" 
              loading="lazy" 
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>

          <!-- Contact Form -->
          <div class="bg-slate-800/50 p-6 md:p-8 rounded-2xl border border-slate-700 mt-8">
            <h3 class="text-xl font-semibold text-white mb-6">Send Me a Message</h3>
            
            <form action="#" class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" name="fullname" placeholder="Full name" required 
                  class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-tech-accent focus:ring-1 focus:ring-tech-accent transition-colors placeholder:text-slate-500">
                <input type="email" name="email" placeholder="Email address" required 
                  class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-tech-accent focus:ring-1 focus:ring-tech-accent transition-colors placeholder:text-slate-500">
              </div>
              <textarea name="message" placeholder="Your Message" required rows="5"
                class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-tech-accent focus:ring-1 focus:ring-tech-accent transition-colors placeholder:text-slate-500 resize-none"></textarea>
              
              <div class="flex justify-end">
                <button type="submit" class="flex items-center gap-2 bg-slate-700 text-white px-8 py-3 rounded-xl font-medium hover:bg-tech-accent hover:text-slate-900 transition-all hover:shadow-[0_0_15px_rgba(56,189,248,0.4)]">
                  <ion-icon name="paper-plane-outline" class="text-lg"></ion-icon>
                  <span>Send Message</span>
                </button>
              </div>
            </form>
          </div>

        </section>
      </div>
    </div>
  </main>
</body>
</html>
